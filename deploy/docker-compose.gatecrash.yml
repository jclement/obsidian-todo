# Obsidian Todo exposed through a self-hosted Gatecrash tunnel
# (https://github.com/jclement/gatecrash).
#
# 1. Copy this file to docker-compose.yml and create a .env next to it:
#      GATECRASH_SERVER=tunnel.example.com:51234
#      GATECRASH_HOST_KEY=SHA256:...
#      GATECRASH_TOKEN=obsidian-todo:SECRET
# 2. docker compose up -d
# 3. docker compose logs app   ← grab the setup token, open https://<your-host>/setup
#
# SET PUBLIC_URL for any public deployment (below). It pins the origin so the
# Host header can't be spoofed, forces Secure cookies, and enables strict host
# rejection. Leaving it unset (deriving the origin from forwarded headers) is
# only safe for localhost/dev. The app port (3000) is never published here —
# only the tunnel reaches it.

services:
  app:
    image: ghcr.io/jclement/obsidian-todo:latest
    # To build from a local checkout instead of pulling the published image,
    # uncomment this and run `docker compose up --build`:
    # build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      PUBLIC_URL: https://notes.example.com   # ← set to your real https hostname
    volumes:
      - ./data:/data

  tunnel:
    image: ghcr.io/jclement/gatecrash:latest
    restart: unless-stopped
    depends_on:
      - app
    environment:
      GATECRASH_SERVER: ${GATECRASH_SERVER}
      GATECRASH_HOST_KEY: ${GATECRASH_HOST_KEY}
      GATECRASH_TOKEN: ${GATECRASH_TOKEN}
      GATECRASH_TARGET: app:3000

# Obsidian Todo exposed through a Cloudflare Tunnel.
#
# 1. In Cloudflare Zero Trust, create a tunnel and point its public hostname
#    (e.g. notes.example.com) at http://app:3000.
# 2. Copy this file to docker-compose.yml and create a .env next to it:
#      CLOUDFLARED_TUNNEL_TOKEN=eyJ...
# 3. docker compose up -d
# 4. docker compose logs app   ← grab the setup token, open https://<your-host>/setup
#
# SET PUBLIC_URL for any public deployment (below). It pins the origin so the
# Host header can't be spoofed, forces Secure cookies, and enables strict host
# rejection. Leaving it unset (deriving the origin from forwarded headers) is
# only safe for localhost/dev. The app port (3000) is never published here —
# only cloudflared reaches it.

services:
  app:
    image: ghcr.io/jclement/obsidian-todo:latest
    # To build from a local checkout instead of pulling the published image,
    # uncomment this and run `docker compose up --build`:
    # build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      PUBLIC_URL: https://notes.example.com   # ← set to your real https hostname
      # For the native iOS wrapper (apple/): serves the Apple App Site
      # Association so the app's passkeys work. "<TeamID>.<bundleId>".
      # IOS_APP_ID: ABCDE12345.net.onewheelgeek.todo
    volumes:
      - ./data:/data

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - app
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN}
